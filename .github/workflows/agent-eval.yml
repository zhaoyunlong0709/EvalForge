name: Agent Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    # L1 冒烟测试：P0 用例，每次 push/PR 触发
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent_eval_framework/pyproject.toml

      - name: Install dependencies
        run: |
          cd agent_eval_framework
          pip install -e ".[dev]"

      - name: Run framework unit tests
        run: |
          cd agent_eval_framework
          python -m pytest tests/ -v --tb=short

      - name: Dry-run case validation
        run: |
          cd agent_eval_framework
          python -m eval_core.cli.main run \
            --cases-dir cases \
            --config config/global.yaml \
            --dry-run

      - name: Run smoke evaluation (P0 only)
        if: env.AGENT_ENDPOINT != ''
        run: |
          cd agent_eval_framework
          python -m eval_core.cli.main run \
            --cases-dir cases \
            --config config/global.yaml \
            --priority P0
        env:
          AGENT_ENDPOINT: ${{ secrets.AGENT_ENDPOINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: agent_eval_framework/reports/
          retention-days: 30

  regression:
    # L2 回归测试：P0+P1 用例，PR 合并前触发
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd agent_eval_framework
          pip install -e ".[dev]"

      - name: Run regression evaluation (P0 + P1)
        run: |
          cd agent_eval_framework
          python -m eval_core.cli.main run \
            --cases-dir cases \
            --config config/global.yaml \
            --priority P0 --priority P1 \
            --concurrency 3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-regression-${{ github.sha }}
          path: agent_eval_framework/reports/
          retention-days: 30
